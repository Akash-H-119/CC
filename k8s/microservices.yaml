apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4001
        env:
        - name: PORT
          value: "4001"
        - name: MONGODB_URI
          value: "mongodb://mongo:27017/mingleup"
        - name: JWT_SECRET
          value: "k8s_secret_key_change_me_in_prod"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
  - port: 4001
    targetPort: 4001
---
